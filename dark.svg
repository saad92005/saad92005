<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Saad (saad92005) — Full-Stack Engineer, AI Engineer, SaaS Builder and student. Featured projects: aes-app, saad-portfolio, omnira, arabic-dialect-mt-nlp, attendtrack.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#030712"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1178" height="608" rx="24"/>
    </clipPath>
    <filter id="softBlur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1180" height="610" fill="url(#bg)"/>
    <rect width="1180" height="610" fill="url(#grid)"/>
    <circle cx="140" cy="120" r="220" fill="url(#glow1)" filter="url(#softBlur)">
      <animate attributeName="cx" values="140;180;140" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="500" r="240" fill="url(#glow2)" filter="url(#softBlur)">
      <animate attributeName="cy" values="500;460;500" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- particles -->
    <g fill="#94A3B8" fill-opacity="0.35">
      <circle cx="220" cy="90" r="1.4"><animate attributeName="cy" values="90;70;90" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="140" r="1.6"><animate attributeName="cy" values="140;120;140" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="560" r="1.3"><animate attributeName="cy" values="560;540;560" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="480" r="1.5"><animate attributeName="cy" values="480;460;480" dur="10s" repeatCount="indefinite"/></circle>
    </g>

