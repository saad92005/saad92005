      <text x="242" y="410" font-size="14" fill="#F8FAFC" text-anchor="middle" font-weight="600">Full-Stack · AI · SaaS</text>
      <text x="242" y="432" font-size="12" fill="#94A3B8" text-anchor="middle">building shipped, working software</text>

      <line x1="58" y1="470" x2="426" y2="470" stroke="#94A3B8" stroke-opacity="0.15"/>
      <text x="58" y="500" font-size="13" fill="#94A3B8">~/saad92005 <tspan fill="#22D3EE">$</tspan> build --ship</text>
      <rect x="252" y="489" width="7" height="14" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <text x="58" y="540" font-size="11" fill="#64748B">student · early-career engineer</text>
      <text x="58" y="558" font-size="11" fill="#64748B">github.com/saad92005</text>
    </g>

