<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Saad (saad92005) — Full-Stack Engineer, AI Engineer, SaaS Builder and student. Featured projects: omnira, attendtrack, arabic-dialect-mt-nlp.">
  <defs>
