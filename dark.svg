        <circle cx="616" cy="329" r="3" fill="#10B981"/>
        <text x="628" y="333">Flutter</text>

        <rect x="688" y="314" width="66" height="30" rx="15" fill="url(#pillFill)" stroke="#7C3AED" stroke-opacity="0.4"/>
        <circle cx="702" cy="329" r="3" fill="#10B981"/>
        <text x="714" y="333">Dart</text>

        <rect x="764" y="314" width="76" height="30" rx="15" fill="url(#pillFill)" stroke="#7C3AED" stroke-opacity="0.4"/>
        <circle cx="778" cy="329" r="3" fill="#22D3EE"/>
        <text x="790" y="333">Python</text>

        <rect x="850" y="314" width="82" height="30" rx="15" fill="url(#pillFill)" stroke="#7C3AED" stroke-opacity="0.4"/>
        <circle cx="864" cy="329" r="3" fill="#EAB308"/>
        <text x="876" y="333">Firebase</text>

        <rect x="942" y="314" width="104" height="30" rx="15" fill="url(#pillFill)" stroke="#7C3AED" stroke-opacity="0.4"/>
        <circle cx="956" cy="329" r="3" fill="#22D3EE"/>
        <text x="968" y="333">HTML/CSS</text>
      </g>

      <line x1="496" y1="368" x2="1122" y2="368" stroke="#94A3B8" stroke-opacity="0.12"/>

      <!-- projects -->
      <text x="496" y="394" font-size="12" letter-spacing="2" fill="#64748B">SELECTED PROJECTS</text>

      <g font-size="13.5">
        <text x="496" y="420" fill="#22D3EE" font-weight="600">aes-app</text>
        <text x="608" y="420" fill="#94A3B8">Flutter/Firebase business management platform</text>

        <text x="496" y="446" fill="#22D3EE" font-weight="600">saad-portfolio</text>
        <text x="680" y="446" fill="#94A3B8">Personal portfolio site</text>

        <text x="496" y="472" fill="#22D3EE" font-weight="600">omnira</text>
        <text x="608" y="472" fill="#94A3B8">AI desktop assistant, built as a monorepo</text>
      </g>

      <line x1="496" y1="500" x2="1122" y2="500" stroke="#94A3B8" stroke-opacity="0.12"/>

      <!-- links -->
      <text x="496" y="526" font-size="12" letter-spacing="2" fill="#64748B">LINKS</text>
      <g font-size="13.5" fill="#F8FAFC">
        <circle cx="502" cy="546" r="3" fill="#7C3AED"/>
        <text x="512" y="551">github.com/saad92005</text>
      </g>

      <text x="1122" y="562" font-size="11" fill="#334155" text-anchor="end">generated · terminal ui</text>
    </g>
  </g>

  <rect x="1" y="1" width="1178" height="608" rx="24" fill="none" stroke="#0B1220" stroke-width="2"/>
