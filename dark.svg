        <circle cx="242" cy="248" r="98" fill="none" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>
        <circle cx="242" cy="248" r="82" fill="none" stroke="url(#accentSweep)" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 242 248" to="360 242 248" dur="30s" repeatCount="indefinite"/>
        </circle>
        <circle cx="242" cy="166" r="4" fill="#22D3EE">
          <animateMotion dur="30s" repeatCount="indefinite" path="M 0 0 A 82 82 0 1 1 -0.1 0 Z"/>
        </circle>
        <circle cx="242" cy="248" r="64" fill="url(#panelFill)" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="242" y="266" font-size="56" font-weight="700" fill="#F8FAFC" text-anchor="middle">S</text>
