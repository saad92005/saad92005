        </text>
        <text x="596" y="252" opacity="0">shipped, real-world projects while studying
          <animate attributeName="opacity" values="0;1" dur=".6s" begin="1.1s" fill="freeze"/>
        </text>
      </g>

      <line x1="496" y1="276" x2="1122" y2="276" stroke="#94A3B8" stroke-opacity="0.12"/>

      <!-- stack pills -->
      <text x="496" y="302" font-size="12" letter-spacing="2" fill="#64748B">STACK</text>
