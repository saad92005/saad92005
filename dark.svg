      <text x="496" y="104" font-size="12" letter-spacing="2" fill="#7C3AED">[ SYSTEM.INFO ]</text>
      <text x="1120" y="104" font-size="12" fill="#64748B" text-anchor="end">./profile.sh</text>
      <line x1="496" y1="116" x2="1122" y2="116" stroke="#94A3B8" stroke-opacity="0.15"/>

      <text x="496" y="150" font-size="26" font-weight="700" fill="#F8FAFC">Saad</text>
      <text x="496" y="174" font-size="13" fill="#22D3EE">@saad92005</text>

      <!-- info rows: right-aligned labels, left-aligned values -->
      <g font-size="13" fill="#64748B" text-anchor="end">
        <text x="580" y="200">ROLE</text>
        <text x="580" y="226">FOCUS</text>
        <text x="580" y="252">BUILDING</text>
