name: Build README

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [master]
    paths: [build_readme.py, assets/cards.py, assets/header.py, assets/scene3d.py, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild live sections
        run: |
          pip install --quiet fonttools
          python build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit only if something actually changed
        run: |
          git add -N assets; git diff --quiet && { echo "No changes"; exit 0; }
          git config user.name "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git commit -m "Update live README sections"
          git push
