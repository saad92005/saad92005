<svg xmlns="http://www.w3.org/2000/svg" width="580" height="290" viewBox="0 0 580 290">
  <style>
    .name { font: 800 30px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #fff; letter-spacing: -.5px; }
    .tagline { font: 600 16px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: url(#acc); }
    .body { font: 400 15px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .tag { font: 600 12.5px 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #e2e8f0; }
    .badge { font: 700 11px 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #070b18; letter-spacing: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { transform-origin: 290px 145px; animation: spin 8s linear infinite; }
    @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    .glow { animation: glow 5s ease-in-out infinite; filter: blur(40px); }
    @keyframes shine { from { transform: translateX(-200px) skewX(-20deg); } to { transform: translateX(800px) skewX(-20deg); } }
    .shine { animation: shine 7s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="outer"><rect width="580" height="290" rx="20"/></clipPath>
    <clipPath id="inner"><rect x="2" y="2" width="576" height="286" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#outer)">
    <g class="spin"><rect x="-200" y="-200" width="980" height="690" fill="url(#acc)"/><rect x="-200" y="145" width="980" height="345" fill="#1e293b"/></g>
  </g>
  <g clip-path="url(#inner)">
    <rect width="580" height="290" fill="#0b1022"/>
    <circle class="glow" cx="520" cy="30" r="110" fill="#34d399"/>
    <rect class="shine" x="0" y="0" width="120" height="290" fill="url(#sh)"/>
    <rect x="32" y="34" width="172" height="22" rx="11" fill="url(#acc)"/>
    <text class="badge" x="118.0" y="49.5" text-anchor="middle">PRODUCTION SOFTWARE</text>
    <text class="name" x="32" y="94">AES App</text>
    <text class="tagline" x="159" y="93">field operations platform</text>
    <text class="body" x="32" y="132">Built for a real engineering services company</text><text class="body" x="32" y="158">Work orders auto-imported from Gmail · GPS attendance</text><text class="body" x="32" y="184">Payroll engine · double-entry accounting · inventory</text><text class="body" x="32" y="210">12 roles with tailored access · PDF/Excel exports</text>
    <rect x="32" y="232" width="75" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text class="tag" x="69" y="251" text-anchor="middle">Flutter</text><rect x="114.80000000000001" y="232" width="50" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text class="tag" x="140" y="251" text-anchor="middle">Dart</text><rect x="172.4" y="232" width="83" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text class="tag" x="214" y="251" text-anchor="middle">Firebase</text><rect x="263.6" y="232" width="92" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/><text class="tag" x="309" y="251" text-anchor="middle">Gmail API</text>
  </g>
</svg>
