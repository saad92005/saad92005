<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110">
<style>@font-face{font-family:'H';src:url(data:font/ttf;base64,) format('truetype');}
.sig{font-family:H,cursive;font-size:72px;fill:#ece7df;fill-opacity:0;stroke:#ece7df;stroke-width:1.2;
stroke-dasharray:900;stroke-dashoffset:900;animation:write 2.2s ease-in-out .3s forwards, fill .8s 2.1s forwards}
