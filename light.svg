        <text x="628" y="333">Flutter</text>

        <rect x="688" y="314" width="66" height="30" rx="15" fill="url(#pillFillL)" stroke="#2563EB" stroke-opacity="0.3"/>
        <circle cx="702" cy="329" r="3" fill="#10B981"/>
        <text x="714" y="333">Dart</text>

