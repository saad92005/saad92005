<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Saad (saad92005) — Full-Stack Engineer, AI Engineer, SaaS Builder and student. Featured projects: aes-app, saad-portfolio, omnira, arabic-dialect-mt-nlp, attendtrack.">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="accentSweepL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1L" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2L" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pillFillL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="gridL" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0F172A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClipL">
      <rect x="1" y="1" width="1178" height="608" rx="24"/>
    </clipPath>
    <filter id="softBlurL"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g clip-path="url(#frameClipL)">
    <rect width="1180" height="610" fill="url(#bgL)"/>
    <rect width="1180" height="610" fill="url(#gridL)"/>
    <circle cx="140" cy="120" r="220" fill="url(#glow1L)" filter="url(#softBlurL)">
      <animate attributeName="cx" values="140;180;140" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="500" r="240" fill="url(#glow2L)" filter="url(#softBlurL)">
      <animate attributeName="cy" values="500;460;500" dur="16s" repeatCount="indefinite"/>
    </circle>

    <g fill="#334155" fill-opacity="0.25">
      <circle cx="220" cy="90" r="1.4"><animate attributeName="cy" values="90;70;90" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="140" r="1.6"><animate attributeName="cy" values="140;120;140" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="560" r="1.3"><animate attributeName="cy" values="560;540;560" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="480" r="1.5"><animate attributeName="cy" values="480;460;480" dur="10s" repeatCount="indefinite"/></circle>
