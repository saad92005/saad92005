      <text x="496" y="104" font-size="12" letter-spacing="2" fill="#2563EB">[ SYSTEM.INFO ]</text>
      <text x="1120" y="104" font-size="12" fill="#94A3B8" text-anchor="end">./profile.sh</text>
      <line x1="496" y1="116" x2="1122" y2="116" stroke="#0F172A" stroke-opacity="0.08"/>

      <text x="496" y="150" font-size="26" font-weight="700" fill="#0F172A">Saad</text>
      <text x="496" y="174" font-size="13" fill="#2563EB">@saad92005</text>

      <!-- info rows: right-aligned labels, left-aligned values -->
      <g font-size="13" fill="#94A3B8" text-anchor="end">
