      <line x1="0" y1="46" x2="1180" y2="46" stroke="#2563EB" stroke-opacity="0.15"/>
      <circle cx="30" cy="23" r="5.5" fill="#EF4444"/>
      <circle cx="50" cy="23" r="5.5" fill="#EAB308"/>
      <circle cx="70" cy="23" r="5.5" fill="#22C55E"/>
      <text x="96" y="28" font-size="13" fill="#475569">saad92005@profile:~</text>
      <circle cx="1088" cy="23" r="4" fill="#059669">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1148" y="28" font-size="12" fill="#059669" text-anchor="end">[ ONLINE ]</text>
    </g>

