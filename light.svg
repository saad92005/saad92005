        <circle cx="864" cy="329" r="3" fill="#D97706"/>
        <text x="876" y="333">Firebase</text>

        <rect x="942" y="314" width="104" height="30" rx="15" fill="url(#pillFillL)" stroke="#2563EB" stroke-opacity="0.3"/>
        <circle cx="956" cy="329" r="3" fill="#06B6D4"/>
        <text x="968" y="333">HTML/CSS</text>
      </g>

      <line x1="496" y1="368" x2="1122" y2="368" stroke="#0F172A" stroke-opacity="0.08"/>

      <text x="496" y="394" font-size="12" letter-spacing="2" fill="#94A3B8">SELECTED PROJECTS</text>

      <g font-size="13.5">
        <text x="496" y="420" fill="#2563EB" font-weight="600">aes-app</text>
        <text x="608" y="420" fill="#475569">Flutter/Firebase business management platform</text>

        <text x="496" y="446" fill="#2563EB" font-weight="600">saad-portfolio</text>
        <text x="680" y="446" fill="#475569">Personal portfolio site</text>

        <text x="496" y="472" fill="#2563EB" font-weight="600">omnira</text>
        <text x="608" y="472" fill="#475569">AI desktop assistant, built as a monorepo</text>
      </g>

      <line x1="496" y1="500" x2="1122" y2="500" stroke="#0F172A" stroke-opacity="0.08"/>

      <text x="496" y="526" font-size="12" letter-spacing="2" fill="#94A3B8">LINKS</text>
      <g font-size="13.5" fill="#0F172A">
        <circle cx="502" cy="546" r="3" fill="#2563EB"/>
        <text x="512" y="551">github.com/saad92005</text>
      </g>

      <text x="1122" y="562" font-size="11" fill="#CBD5E1" text-anchor="end">generated · terminal ui</text>
    </g>
