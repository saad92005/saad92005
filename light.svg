      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".8s" begin="0.1s" fill="freeze"/>
        <circle cx="242" cy="248" r="98" fill="none" stroke="#0F172A" stroke-opacity="0.10" stroke-width="1"/>
        <circle cx="242" cy="248" r="82" fill="none" stroke="url(#accentSweepL)" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 242 248" to="360 242 248" dur="30s" repeatCount="indefinite"/>
        </circle>
        <circle cx="242" cy="166" r="4" fill="#06B6D4">
          <animateMotion dur="30s" repeatCount="indefinite" path="M 0 0 A 82 82 0 1 1 -0.1 0 Z"/>
        </circle>
        <circle cx="242" cy="248" r="64" fill="url(#panelFillL)" stroke="#2563EB" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="242" y="266" font-size="56" font-weight="700" fill="#0F172A" text-anchor="middle">S</text>
