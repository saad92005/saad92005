      <text x="58" y="104" font-size="12" letter-spacing="2" fill="#06B6D4">[ VISUAL.MAP ]</text>
      <line x1="58" y1="116" x2="426" y2="116" stroke="#0F172A" stroke-opacity="0.08"/>

