      <text x="242" y="432" font-size="12" fill="#475569" text-anchor="middle">building shipped, working software</text>

      <line x1="58" y1="470" x2="426" y2="470" stroke="#0F172A" stroke-opacity="0.08"/>
      <text x="58" y="500" font-size="13" fill="#334155">~/saad92005 <tspan fill="#2563EB">$</tspan> build --ship</text>
      <rect x="252" y="489" width="7" height="14" fill="#2563EB">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
